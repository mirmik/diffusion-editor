[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-editor"
version = "0.1.0"
description = "Diffusion image editor built on termin-gui-native and tgfx."
requires-python = ">=3.14,<3.15"
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
diffusion-editor = "diffusion_editor.app.main:main"
diffusion-editor-multiview = "diffusion_editor.multiview_studio.main:main"

[tool.setuptools.packages.find]
include = ["diffusion_editor*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements-project.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
test = {file = ["requirements-test.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
